dump_dir: /workspace/bci/checkpoints/bci/ZUNA2_5e-4_noALW2
name: ZUNA2_5e-4_noALW2
steps: 800_000 # (CW) was 100_000 # This controls both LR schedule and Total # of steps. [173k steps for 1 epoch on TUH w/ 4GPUs.]
grad_acc_steps: 2 # (CW) - wasnt here. Defaults to 1. 
probe_freq: null
seed: 333     # (CW) - This is used for something other than data shuffling. Not sure what. Used for eval harness when using fixed eval.
repa_into_encoder: false
repa_into_decoder: false
load_distillation_model: false

channel_loss_weighting: false
distill_into_encoder: false
track_dataset_stats: false # (CW) - added this to track data stats in training loop. Defaults to false.
slack_alert: false # 

encoder_mmd_weight: 0 #1e-2 #1e-4 # (CW) - set to zero to try to fix GradNorm Spikes. (was 1e-4 orig) (has been 1e-2).

optim:      # (CW) - Note: Using Cosine with Warmup == 1Cycle basically. 
  lr: 5e-4  # (CW) - was 3e-4
  weight_decay: 0.1 # (CW) - was 0.01 # Moh suggests 0.1
  warmup: 1000 # (CW) is 10% of 1 epoch - was 2000 # Beren suggested lower.
  lr_min_ratio: 2e-3 #0.000001
  clip: 1.0 #100.0 #10.0 # 0.1 (CW) - was 1.0 orig. 0.1 for OpenNeuro
  beta1: 0.9 # (CW) - wasnt here. Defaults to 0.9 - Moh suggestion (0.85) for stability.
  beta2: 0.95 # (CW) - wasnt here. Defaults to 0.95 - Moh suggestion (0.9) for stability.
  scheduler: cosine # (CW) - was trapezoidal
  # optim_cls: cadamw # (CW) Note: This is "Cautious Adam", not CAAdamW! Dont use.
  use_ema: true
  ema_decay: 0.9999

distributed:
  fsdp_type: no_shard 
  compile: true # (CW) - defaults to true. Set false to Debug BF16 also @torch.compile fwd_step()
  model_dtype: bf16 # fp32 # (CW) -  was bf16 # Note: even if BF16, norms and residual stream are done in FP32 for stability.
  matmul_allow_tf32: true # (CW) - TRY SETTING TO TRUE. A DATATYPE LIKE BF16. SHOULD SPEED THINGS UP.
  selective_activation_checkpointing: false # (CW) - THIS WILL NOT WORK WITH FLEX ATTENTION.
  tp_size: 1
  spawn_method: spawn # added by (CW). - Was not here and defaulted to "forkserver"
  # dp_replicate: 1     # added by (CW). - turn off FSDP to run on 1 GPU. Comment out to run on multi-GPU
  # dp_shard: 1         # added by (CW). - turn off FSDP to run on 1 GPU. Comment out to run on multi-GPU

model: 
  dim: 1024
  n_layers: 16
  head_dim: 64
  seqlen_t: false
  huber_c: null                              # (CW) - was 0.1 [null uses MSE only] (value was tuned for audio data anyway)
  input_dim: 32 #128 #131                        # (CW) - set to num time points when not mixing chans (or |tf|+3 if mixing chans with xyz)
  encoder_input_dim: 32 #128 #131                # (CW) - set to num time points when not mixing chans   
  encoder_output_dim: 32 #128 #131 # input_dim*2 # (CW) - "EOD" effects enc_out dim2 - the "registers" [B, T/ds, EOD]
  encoder_latent_downsample_factor: 1        # (CW) - effects the number / time-dimension of "registers" in the encoder and enc_out dim1 [B, T/ds, EOD]

  encoder_sliding_window: 65536 #2048 #256 #512 #64 #128           # (CW) - default is 128
  sliding_window: 65536 #2048 #256 #64 #128                   # (CW) - default is 128
  xattn_sliding_window: 65536 #2048 #256 #64 #32              # (CW) - default is 32
  max_seqlen: 256 #42000 #34000 #66000 #16384                 # (CW) - Max value for discretized {x,y,z} or tc - used with 4D-ROPE
  max_chans: 512                                              # (CW) - Max number of channels in the dataset - used for APE sinusoidal position embeddings

  model_dtype: bf16 # fp32 # (CW) -  was bf16 # needed for APE sinusoidal position embeddings. Must match distributed.model_dtype.
  stft_global_sigma: 0.1 # defaults to 1.0 # (CW) - global sigma for z initialization in model.sample .

  # decoder_encoder_dropout: 0.1          # 0.1 # (CW) - prob of dropping out entire batch in encoder output going into decoder. (default is 0.1)
  # decoder_timestep_dropout: 0.2         # 0.1 # (CW) - prob of dropping out channels from encoder output going into decoder if DONT_MIX_CHANNELS=True. (default is 0.1)

  adaptive_loss_weighting: false  # (CW) - set to true to try to fix GradNorm Spikes.
  kept_token_loss_weight: 0.1 # weight on NON-dropped tokens
                              # loss. 1.0 = current behaviour,
                              # 0.0 = MAE (dropped only), 
                              # 0.1-0.3 = downweight.
  # do_QK_norm: true # If true, do QK normalization.
  # do_sandwich_norm: true # If true, do sandwich normalization.

  num_fine_time_pts: 32 #128
  rope_dim: 4 # 0 = NoPE, 1 = 1D-RoPE in seq-dim, 4 = 4D-RoPE in {x,y,z,tc}.
  rope_theta: 10000.0 # Default = 10000.0 - is too big when max_seqlen=40?
  ape_dim: 0 # 0 = No-APE, 1 = 1D-APE on ch_id,
  ape_theta: 10000.0 
  ape_embedding_type: "scaled_dim_sinusoidal" # {"scaled_1d_sinusoidal", "scaled_dim_sinusoidal", "full_learned_sinusoidal"} - Type of APE embedding to use.
  tok_idx_type: "{x,y,z,tc}" # null, "t_coarse", "chan_id", "stack_arange_seqlen", "{x,y,z,tc}", "{x,y,z,tc,ch}"
  dont_noise_chan_xyz: false # If true, do not add noise to channel {x,y,z}-position in EncoderDecoder.sample (use in tandem with NoPE)
  zero_spatial: false  # If true, zero out x,y,z in tok_idx, keeping only tc and ch - to mimic data with no channel {x,y,z} position information.
  dropout_vec_type: "zero" # {"zero", "learnable"}
  register_tok_idx: "mean_all" # {"zero_all", "mean_all", "mean_t"} - If "zero_all", then each register has {x,y,z,t,(ch)} = {0,0,0,0,(0)}. 
                           # If "mean_all", then each register has {x,y,z,t,(ch)} = {mean(x),mean(y),mean(z),mean(t),mean(ch)}.
                           # If "mean_t", then each register has {x,y,z,t,(ch)} = {0,0,0,mean(t),(0)}.

data:
  use_b2: false # If true, use Backblaze B2 for dataset loading, otherwise use local filesystem.
  use_v3: true # If true, use EEGDataset_v3 for dataset loading, with memaps and quality matrix
  filter_version: # "v2_notch" # options: {"v1_hpf",  "v2_notch",  "v3_bandpass"}
    - "v2_notch"
    - "v3_bandpass"
  min_quality_any: 0.1 # Default is 0.1
  min_quality_mean: 0.3 # Default is 0.3
  sample_duration_str: "30_seconds" # {"5_seconds", "10_seconds", "30_seconds", "5_sec_wt_short_third", "5_sec_wt_short_half", "10_to_30_sec_half", "10_to_30_sec_third", "30_seconds_fifths"}
  do_avg_ref: true # If true, do average reference before data normalization.
  z_score_type: "across_channel" # {"across_channel", "across_sample", "none"}
  data_dir: /workspace/bci/data/v7_train
  glob_filter: 
    - "*.json"
    #
    # - "ds*_f03000_*.json"
    # - "tuh*_f00600_*.json"

  mmap_sample_start: null #4096 #1024 # If not None, only sample from between this and stop in the mmap.
  mmap_sample_stop: null #42496 #5376 # If not None, only sample from between this and start in the mmap.
  skip_preepoched_data: false # If true, skip pre-epoched data.

  chan_num_filter: null # null or integer number of channels we want in each sample
  sample_rate: 256 #512 # datasets are resampled to 256Hz now.
  seq_len: 1280 #2560   # NOT REALLY USED ANYMORE - dataset are fixed to 1280 timepoints now 5 sec at 256Hz.
  num_fine_time_pts: 32 #128
  use_coarse_time: "A" # How to chop signals in to coarse-time, fine-time & channels using chop_and_reshape_signals or chop_signals_only
  cat_chan_xyz_and_eeg: false
  dont_noise_chan_xyz: false # If true, do not add noise to channel {x,y,z}-position in EEGProcessor.process (use in tandem with NoPE)
  randomly_permute_sequence: true
  stft_global_sigma: 0.1 # defaults to 1.0 # (CW) - global sigma for stft noise schedule.
  masked_in_decoder: false # If true, mask out channels in decoder input when channel is dropped.
  token_dropout_prob: 0.99 # Probability of applying channel dropout to the EEG signal during training.
  dropout_scheme: "mix-4-dropouts-train" # {"train-1", "train-2", "eval-1", "no-dropout", "random-uniform-dropout", "full-channel-random-dropout-train", 
                                                 #  "full-time-pt-random-dropout", "correlated-channel-time-dropout", 
                                                 #  "mix-4-dropouts-train", "mix-8-dropouts-train", "mix-3-dropouts-train"
                                                 #  "consumer-eeg-channel-dropout", "standard-montage-channel-dropout", "random-montage-channel-dropout", "brain-region-channel-dropout",
                                                 #  "consumer-eeg-channel-dropout-by-name", "standard-montage-channel-dropout-by-name", "brain-region-channel-dropout-by-name"}
  
  num_bins_discretize_xyz_chan_pos: 100 # Number of bins to discretize channel positions to use in 4d-RoPE. # 40 with "old" xyz_extremes, 100 with "thirteens" xyz_extremes
  chan_pos_xyz_extremes_type: "twelves" # "old" for v4 dataset or "thirteens" for v5 dataset

  batch_size: 1 #64 #1024 # 32              # (CW) - editted this for debug. KEEP AT 1 NOW.
  target_packed_seqlen: 22000 #         # (CW) - Target seqlen for packed samples. This is essentially batch size.
  data_norm: 10.0 # this is the norm to divide the data by, to normalize it.
  data_clip: 1.0  # Clip data to this value after normalization.
  #
  num_workers: 16             # (CW) - editted this for debug.
  prefetch_factor: 8          # (CW) - editted this for debug. 
  persistent_workers: true    # (CW) - added this. defaults to true
  pin_memory: true            # (CW) - added this. defaults to true
  diffusion_forcing: false
  diffusion_noise_schedule: "linear"   # {"linear","beta","logit"}
  logit_normal_mean: 0.0   # if diffusion_noise_schedule==logit, centre of hump = sigmoid(mean); 0 -> t=0.5
  logit_normal_std: 1.0   # if diffusion_noise_schedule==logit, width; ~1 unimodal hump (SD3), >=2 -> U-shaped
  pad_packed_seqlen: true    # CLODE: pad packed seq to fixed target_packed_seqlen (training). requires target % encoder_latent_downsample_factor == 0.

  shuffle: true               # (CW) - trying to pin down is bad data is causing GradNorm explosion.
  seed: null                   # (CW) - seed for data shuffling (int or null)

checkpoint:
  dump:
    every: 500 #10000
    keep: 200 #35
  eval:
    every: 2000 # 500000000000000 # How often to run eval harness.
    keep: -1
  load_optimizer_state: true # (CW) - set to false to not load optimizer state from checkpoint, defaults to true. (CW)
  # init_ckpt_path: /workspace/bci/checkpoints/bci/bci_AY2l_bigrun16e/checkpoints/0000150000
  # init_ckpt_path: /workspace/bci/checkpoints/bci/DSv3_exp99/checkpoints/0000050000

logging:
  freq: 1
  wandb:
    project: "ay2l_zuna2_cw"  # Add your project name

# async_eval_gpus: 8

eval:
  use_b2: false # If true, use Backblaze B2 for dataset loading, otherwise use local filesystem.
  use_v3: true # If true, use EEGDataset_v3 for dataset loading, with memaps and quality matrix
  filter_version: # "v2_notch" # options: {"v1_hpf",  "v2_notch",  "v3_bandpass"}
    - "v2_notch"
    - "v3_bandpass"
  min_quality_any: 0.1 # Default is 0.1
