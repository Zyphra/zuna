[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zuna"
version = "1.1.6"
description = "Foundation model for EEG reconstruction and interpolation"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    {name = "Christopher Warner", email = "chris@zyphra.com"},
    {name = "Jonas Mago"},
    {name = "JR Huml"},
    {name = "Beren Millidge", email = "beren@zyphra.com"}
]

keywords = ["eeg", "foundation-model", "neuroscience", "preprocessing"]


dependencies = [
    "numpy>=1.20.0",
    "torch>=2.5",
    "scipy>=1.7.0",
    "mne>=1.0.0",
    "matplotlib",
    "safetensors",
    "joblib>=1.0.0",
    "omegaconf",
    "huggingface-hub",
    "einops",
    "python-dotenv",
]

[project.optional-dependencies]
cloud = ["boto3"]
quantization = ["vector-quantize-pytorch>=1.31.0"]
text = ["sentencepiece", "tiktoken"]
training = ["schedulefree", "wandb"]

# Handle import paths so that single pip install -e . exposes zuna, lingua, and apps (embedded AY2l)
[tool.setuptools.package-dir]
"" = "src"

# Include the config in pip site-packages
[tool.setuptools.package-data]
"*" = ["configs/*.yaml"]

[tool.setuptools.packages.find]
where = ["src", "src/zuna/inference/AY2l/lingua"]
include = ["zuna*", "lingua*", "apps*"]

[project.urls]
Homepage = "https://www.zyphra.com"
Repository = "https://github.com/Zyphra/zuna"
